name: CI

on:
  push:
    branches: [main, production-ready]
  pull_request:
  schedule:
    - cron: '23 6 * * 1' # weekly: catch new advisories against our own dependencies even without code changes
  workflow_dispatch:

# Least privilege by default; jobs opt in to more.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      # Actions are pinned to full commit SHAs (tags can be moved by a compromised upstream).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      # .npmrc sets ignore-scripts=true: no dependency lifecycle script ever runs in CI.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Audit dependencies (npm advisory database)
        run: npm run audit:deps
      - name: Scan own dependencies with DepSentinel (CVE + supply-chain heuristics)
        run: npm run scan:self
      - name: VS Code integration tests
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration

  package:
    name: Package VSIX
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run package
      - name: List package contents (must contain only dist/, media/, docs)
        run: npx vsce ls --no-dependencies
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dep-sentinel-vsix
          path: |
            *.vsix
            *.vsix.sha256
          if-no-files-found: error
          retention-days: 30

  code-scanning:
    name: Publish self-scan to code scanning
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # only this job may upload SARIF
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: node dist/cli.js . --exclude test-fixtures --fail-on none --sarif depsentinel.sarif
      - uses: github/codeql-action/upload-sarif@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3.39.4
        with:
          sarif_file: depsentinel.sarif
          category: depsentinel
